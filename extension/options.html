<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Signal Desk — Settings</title>
<style>
  :root { --accent:#0f6e66; --ink:#19231f; --muted:#5b6b63; --line:#d3dad5; --bg:#f3f6f4; }
  body { font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); max-width: 560px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; } h2 { font-size: 15px; margin-top: 28px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:12px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 4px; }
  input, button, select { font:inherit; padding:9px 11px; border-radius:8px; border:1px solid var(--line); width:100%; box-sizing:border-box; }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; width:auto; padding:9px 16px; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:end; }
  .muted { color:var(--muted); font-size:13px; }
  .mono { font-family: ui-monospace, monospace; font-size:12px; background:#eef1ef; padding:2px 6px; border-radius:5px; }
  #status { margin-top:10px; font-size:13px; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tabs button { background:#fff; color:var(--muted); border:1px solid var(--line); }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
  <h1>Signal Desk — Settings</h1>

  <div class="card">
    <h2 style="margin-top:0">Server</h2>
    <label>API base URL</label>
    <input id="apiBase" placeholder="https://your-domain.com">
    <p class="muted" style="margin-top:8px">This extension's id (add it to <span class="mono">CORS_ORIGINS</span> on the server as
      <span class="mono">chrome-extension://&lt;id&gt;</span>): <span class="mono" id="extId">—</span></p>
    <button class="ghost" id="saveServer">Save server settings</button>
  </div>

  <div class="card" id="authCard">
    <h2 style="margin-top:0">Account</h2>
    <div id="loggedOutBox">
      <div class="tabs"><button class="on" id="tabLogin">Log in</button><button id="tabSignup">Sign up</button></div>
      <label>Email</label><input id="email" type="email">
      <label>Password</label><input id="password" type="password">
      <label id="nameLabel" style="display:none">Display name</label><input id="displayName" style="display:none">
      <div style="margin-top:12px"><button id="doAuth">Log in</button></div>
    </div>
    <div id="loggedInBox" style="display:none">
      <p>Signed in as <b id="whoami">—</b></p>
      <button class="ghost" id="logout">Log out</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Sync</h2>
    <div class="row">
      <button class="ghost" id="syncNow">Sync now</button>
      <button class="ghost" id="rebuild">Rebuild bookmark mirror</button>
    </div>
    <p class="muted" style="margin-top:10px">Two-way bookmark sync mirrors a folder named <b>Signal Desk</b> under “Other Bookmarks”. Only that subtree is touched.</p>
  </div>

  <p id="status" class="muted"></p>
  <script src="options.js" type="module"></script>
</body>
</html>
