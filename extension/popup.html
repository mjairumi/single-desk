<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --accent:#0f6e66; --ink:#19231f; --muted:#5b6b63; --line:#d3dad5; --bg:#fbfcfb; }
  body { width: 320px; margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:700; }
  header .dot { width:16px;height:16px;border-radius:5px;background:var(--accent); }
  .body { padding:14px; display:flex; flex-direction:column; gap:10px; }
  .tab { font-size:13px; color:var(--muted); word-break:break-word; }
  label { font-size:12px; color:var(--muted); font-weight:600; }
  select, button, input { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  button.primary { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
  button { cursor:pointer; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .muted { color:var(--muted); font-size:12px; }
  a { color:var(--accent); }
  #loggedOut { padding:16px; text-align:center; }
  .hidden { display:none; }
</style>
</head>
<body>
  <header><span class="dot"></span> Signal Desk</header>

  <div id="loggedOut" class="hidden">
    <p class="muted">You're not signed in.</p>
    <button class="primary" id="openOptions">Sign in</button>
  </div>

  <div id="loggedIn" class="body hidden">
    <div>
      <label>Save this page</label>
      <div class="tab" id="tabTitle">—</div>
    </div>
    <div class="row">
      <select id="bucket">
        <option value="inbox" selected>Inbox</option>
        <option value="library">Library</option>
        <option value="rounds">Rounds</option>
        <option value="queue">Read-later</option>
        <option value="explore">Explore</option>
      </select>
      <button class="primary" id="saveTab">Save</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:2px 0">
    <button id="saveSession">💾 Save this window as a session</button>
    <div class="row">
      <button id="syncNow">↻ Sync now</button>
      <button id="openApp">Open web app ↗</button>
    </div>
    <div class="muted" id="status"></div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
