# Signal Desk — Render Blueprint (Infrastructure as Code)
# ---------------------------------------------------------------------------
# Deploy: push this repo to GitHub/GitLab, then in Render:
#   Dashboard → New + → Blueprint → select this repo → Apply.
# Render reads this file, creates the Postgres database + web service, wires the
# env vars, runs migrations, and starts the API. Reference:
#   https://render.com/docs/blueprint-spec
#
# COST / DURABILITY — READ THIS:
#   • `plan: free` is fine to kick the tyres, BUT:
#       - Render FREE Postgres is DELETED ~30 days after creation (back up / upgrade!).
#       - FREE web services spin down when idle → cold starts of ~30–60s.
#   • For anything you rely on, set the database to a paid plan (e.g. basic-256mb)
#     and the web service to at least `starter`. Confirm current plan names + prices
#     at https://render.com/pricing before applying.
# ---------------------------------------------------------------------------

# No `databases:` block — the database is Neon, provisioned outside Render.
# Set DATABASE_URL in the Render dashboard (see the envVars note below).

services:
  - type: web
    name: signal-desk-api
    runtime: python
    plan: free                 # ⇦ change to `starter` to avoid idle spin-down
    # Put the service in the SAME region as the Neon database. The Neon endpoint
    # is ap-southeast-1 (Singapore); measured round-trip from a co-located client
    # is ~75 ms, and each /api/sync write costs several round trips (row lock +
    # flush + commit + clock re-read). Running this in Oregon against a Singapore
    # database roughly triples the latency of every write.
    # Options: oregon | ohio | virginia | frankfurt | singapore
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # On PAID plans, prefer running migrations in preDeployCommand (keeps startup clean):
    #   preDeployCommand: alembic upgrade head
    # On the FREE plan there is no preDeploy step, so we migrate in startCommand:
    startCommand: alembic upgrade head && gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        # Neon connection string. `sync: false` means Render PROMPTS for this on
        # first apply and stores it as a secret — it is deliberately NOT written
        # here, because this file is public in git.
        # Paste the pooled URI from the Neon console (Connect → Connection string):
        #   postgresql://<user>:<password>@<endpoint>-pooler.<region>.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        # app/config.py rewrites the scheme to postgresql+psycopg:// and preserves
        # the query parameters.
        sync: false
      - key: SECRET_KEY              # signs JWTs — Render generates a strong random value
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CORS_ORIGINS
        # Comma-separated list of allowed origins.
        #   • your web app origin (your custom domain, and the *.onrender.com URL)
        #   • your extension origin: chrome-extension://<EXTENSION_ID>
        # You won't know the extension id until you load it once — see docs/DEPLOY.md,
        # then edit this value in the Render dashboard (no redeploy of code needed).
        value: "https://YOUR-DOMAIN.com,https://signal-desk-api.onrender.com,chrome-extension://REPLACE_WITH_EXTENSION_ID"
      - key: PYTHON_VERSION
        value: "3.12.6"
